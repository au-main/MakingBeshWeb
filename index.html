<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Making Besh | Unity WebGL Player</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inknut+Antiqua:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #FBEBCE;
            margin: 0;
            padding: 0;
            font-family: 'Inknut Antiqua', serif;
			font-weight: 400;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #5a3921;
        }
        
        .header {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding: 20px 0;
        }
        
        .title-image {
            margin-top: -10px;
            width: 560px;
            height: 288px;
            /* Removed border-radius and box-shadow */
        }
        
        h1 {
            font-size: 60px;
            margin: -30px 0 -30px 0;
            color: #8B4513;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-weight: bold;
        }
        
        #unity-container {
            margin: 0 auto;
            width: 1000px;
            height: 700px;
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            border: 5px solid #D2B48C;
			display: flex;
    		justify-content: center;
    		align-items: center;
    		background: #000;
        }
		#unity-canvas {
			width: 100% !important;
    		height: 100% !important;
			display: block;
		}
        
        .content-section {
            display: flex;
            justify-content: center;
            margin: 40px auto;
            max-width: 1800px;
            padding: 0 150px;
        }
        
        .text-content {
            text-align: left;
            max-width: 700px;
            padding-right: 40px;
            background: rgba(255, 250, 240, 0.8);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .section-title {
            font-size: 24px;
            margin-bottom: 15px;
            color: #8B4513;
            border-bottom: 2px solid #D2B48C;
            padding-bottom: 8px;
        }
        
        .section-text {
            font-size: 16px;
            line-height: 1.6;
            color: #654321;
            margin-bottom: 20px;
        }
        
        .team-list {
            font-size: 16px;
            line-height: 1.8;
            color: #654321;
            padding-left: 20px;
        }
        
        .ending-image {
            width: 500px;
            height: 500px;
			border-radius: 12px;
            margin-left: 40px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            object-fit: cover;
        }
        
        .footer {
            width: 100%;
            background-color: #ECCB94;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #5a3921;
            margin-top: 120px;
            padding: 40px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
			box-sizing: border-box; 
        }
		.footer-image {
    width: 450px;
	box-sizing: content-box;
	object-fit: contain;
padding: 0 40px;

}
        
        .footer::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 10px;
            background: linear-gradient(to right, #8B4513, #D2B48C, #8B4513);
        }
		.footer-content {
    display: grid;
	grid-template-columns: auto 1fr auto;
    align-items: center;
    justify-content: center;
    gap: 40px;
    max-width: 1200px;
	box-sizing: border-box;
}

        
        .contact-info {
            font-size: 16px;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.7);
            font-weight: bold;
        }
        
        @media (max-width: 1400px) {
            .content-section {
                flex-direction: column;
                align-items: center;
            }
            
            .ending-image {
                margin: 30px 0 0 0;
            }
            
            #unity-container {
                width: 90%;
                height: auto;
                aspect-ratio: 1156/700;
            }
        }
        
        @media (max-width: 768px) {
            .title-image {
                width: 90%;
                height: auto;
            }
            
            h1 {
                font-size: 40px;
            }
            
            .ending-image {
                width: 90%;
                height: auto;
            }
            
            .text-content, .section-text, .team-list, .contact-info {
                font-size: 18px;
            }
            
            .section-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <img src="Besh.png" alt="Making Besh" class="title-image">
        <h1>Making Besh</h1>
    </div>

    <div id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas" width="1920" height="1080" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-warning"></div>
        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">making-besh</div>
        </div>
    </div>

    <div class="content-section">
        <div class="text-content">
            <h2 class="section-title">Making Besh:</h2>
            <p class="section-text">Join us as we make the traditional Central Asian dish Beshbarmak and explore its history</p>
            
            <h2 class="section-title">Meet the Team:</h2>
            <div class="team-list">
                Amina Kobenova<br>
                Adina Kaiymova<br>
                Tristan Lai<br>
                Symbat Bekzhigit<br>
                Alim Utemisov<br>
                Bayan Kobenova
            </div>
        </div>
        <img src="Ending.png" alt="Beshbarmak" class="ending-image">
    </div>

    <div class="footer">
	<div class="footer-content">
	<img src="Pitcher2.png" alt="Left decoration" class="footer-image" height="180" >
        <div class="contact-info">
            Contact info:<br>
            amina.works<br>
adinakaiymova.com

        </div>
	<img src="Meat.png" alt="Right decoration" class="footer-image" height="130">
	<div class="footer-content">
    </div>

    <script>
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var fullscreenButton = document.querySelector("#unity-fullscreen-button");
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
            function updateBannerVisibility() {
                warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
            }
            var div = document.createElement('div');
            div.innerHTML = msg;
            warningBanner.appendChild(div);
            if (type == 'error') div.style = 'background: red; padding: 10px;';
            else {
                if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
                setTimeout(function() {
                    warningBanner.removeChild(div);
                    updateBannerVisibility();
                }, 5000);
            }
            updateBannerVisibility();
        }

        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/Build.loader.js";
        var config = {
            dataUrl: buildUrl + "/Build.data",
            frameworkUrl: buildUrl + "/Build.framework.js",
            codeUrl: buildUrl + "/Build.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "making-besh",
            productVersion: "1.0",
            showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            container.className = "unity-mobile";
            canvas.className = "unity-mobile";
        } else {
            canvas.style.width = "1156px";
            canvas.style.height = "700px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
            }).then((unityInstance) => {
                loadingBar.style.display = "none";
                fullscreenButton.onclick = () => {
                    unityInstance.SetFullscreen(1);
                };
            }).catch((message) => {
                alert(message);
            });
        };

        document.body.appendChild(script);
    </script>
</body>
</html>
